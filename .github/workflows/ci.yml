name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The acceptance-evidence check reads the pull request body, so it runs in pr-metadata.yml;
    # a body edit does not re-run this workflow.
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  just-check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: just check
        run: just check </dev/null

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0
    with:
      enforce: true

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [just-check, zizmor]
    permissions: {}
    steps:
      - name: Fail unless every required job succeeded
        env:
          EVENT_NAME: ${{ github.event_name }}
          JUST_CHECK: ${{ needs.just-check.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
        run: |
          echo "just-check=${JUST_CHECK} zizmor=${ZIZMOR} event=${EVENT_NAME}"
          if [ "$JUST_CHECK" != "success" ]; then
            echo "just-check did not succeed: ${JUST_CHECK}"
            exit 1
          fi
          if [ "$ZIZMOR" != "success" ]; then
            echo "zizmor did not succeed: ${ZIZMOR}"
            exit 1
          fi
